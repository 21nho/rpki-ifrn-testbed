! TRANSIT-AS65300 - transito intermediario, usado apenas no cenario C2
! Fica entre RNP (10.6.0.0/30) e OBS (10.3.0.0/30), alongando o caminho legitimo
! para 65300 1916 266174.
hostname TRANSIT-AS65300
!
interface eth0
 description RNP
 ip address 10.6.0.2/30
!
interface eth1
 description OBS
 ip address 10.3.0.1/30
!
router bgp 65300
 no bgp ebgp-requires-policy
 neighbor 10.6.0.1 remote-as 1916
 neighbor 10.6.0.1 description RNP
 neighbor 10.3.0.2 remote-as 65100
 neighbor 10.3.0.2 description OBS
 !
 address-family ipv4 unicast
  neighbor 10.6.0.1 soft-reconfiguration inbound
  neighbor 10.3.0.2 soft-reconfiguration inbound
 exit-address-family
!
