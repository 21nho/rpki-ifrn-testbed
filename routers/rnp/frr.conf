! RNP-AS1916 - provedor de transito do IFRN
! Configuracao base (Fases A, B e cenario C1). Mudancas do C2 em fases/faseC.md
hostname RNP-AS1916
!
interface eth0
 description IFRN
 ip address 10.0.0.2/30
!
interface eth1
 description SWITCH-VALIDADOR
 ip address 10.1.0.3/24
!
interface eth2
 description ATK
 ip address 10.2.0.1/30
!
interface eth3
 description OBS
 ip address 10.3.0.1/30
!
ip route 10.4.0.0/30 10.3.0.2
ip route 10.5.0.0/30 10.3.0.2
!
rpki
 rpki cache tcp 10.1.0.1 3323 preference 1
exit
!
route-map ROV-IN deny 10
 match rpki invalid
route-map ROV-IN permit 20
!
router bgp 1916
 no bgp ebgp-requires-policy
 neighbor 10.0.0.1 remote-as 266174
 neighbor 10.0.0.1 description IFRN
 neighbor 10.2.0.2 remote-as 65666
 neighbor 10.2.0.2 description ATACANTE
 neighbor 10.3.0.2 remote-as 65100
 neighbor 10.3.0.2 description OBSERVADOR
 !
 address-family ipv4 unicast
  neighbor 10.0.0.1 soft-reconfiguration inbound
  neighbor 10.2.0.2 soft-reconfiguration inbound
  ! ROV: ativado a partir da Fase B (ver fases/faseB.md)
  ! neighbor 10.2.0.2 route-map ROV-IN in
  neighbor 10.3.0.2 soft-reconfiguration inbound
 exit-address-family
!
