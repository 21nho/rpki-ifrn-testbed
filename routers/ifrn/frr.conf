! IFRN-AS266174 - roteador de borda da vitima
hostname IFRN-AS266174
!
interface eth0
 description RNP
 ip address 10.0.0.1/30
!
interface eth1
 description SWITCH-VALIDADOR
 ip address 10.1.0.2/24
!
interface lo
 ip address 160.19.252.1/32
 ip address 160.19.252.200/32
!
ip route 160.19.252.0/24 Null0
!
router bgp 266174
 no bgp ebgp-requires-policy
 neighbor 10.0.0.2 remote-as 1916
 neighbor 10.0.0.2 description RNP-UPSTREAM
 !
 address-family ipv4 unicast
  network 160.19.252.0/24
  neighbor 10.0.0.2 soft-reconfiguration inbound
 exit-address-family
!
