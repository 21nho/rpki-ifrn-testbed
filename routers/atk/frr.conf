! ATK-AS65666 - atacante
! Os anuncios sao ativados por cenario: ver fases/
hostname ATK-AS65666
!
interface eth0
 description RNP
 ip address 10.2.0.2/30
!
interface eth1
 description OBS-DIRETO
 ip address 10.4.0.1/30
!
ip route 10.1.0.0/24 10.2.0.1
ip route 10.3.0.0/30 10.2.0.1
ip route 10.5.0.0/30 10.4.0.2
ip route 160.19.252.0/24 Null0
ip route 160.19.252.0/25 Null0
!
router bgp 65666
 no bgp ebgp-requires-policy
 neighbor 10.2.0.1 remote-as 1916
 neighbor 10.2.0.1 description RNP
 neighbor 10.4.0.2 remote-as 65100
 neighbor 10.4.0.2 description OBS-DIRETO
 !
 address-family ipv4 unicast
  neighbor 10.2.0.1 soft-reconfiguration inbound
  neighbor 10.4.0.2 soft-reconfiguration inbound
 exit-address-family
!
