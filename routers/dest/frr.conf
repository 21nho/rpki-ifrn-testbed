! DEST-AS65200 - rede de destino; sem RPKI, herda a decisao do OBS
hostname DEST-AS65200
!
interface eth0
 description OBS
 ip address 10.5.0.2/30
!
ip route 10.0.0.0/30 10.5.0.1
ip route 10.1.0.0/24 10.5.0.1
ip route 10.2.0.0/30 10.5.0.1
ip route 10.3.0.0/30 10.5.0.1
ip route 10.4.0.0/30 10.5.0.1
!
router bgp 65200
 no bgp ebgp-requires-policy
 neighbor 10.5.0.1 remote-as 65100
 neighbor 10.5.0.1 description OBS-UPSTREAM
 !
 address-family ipv4 unicast
  neighbor 10.5.0.1 soft-reconfiguration inbound
 exit-address-family
!
