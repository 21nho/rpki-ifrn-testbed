! OBS-AS65100 - observador (rede terceira qualquer)
! Configuracao base (Fases A, B e cenario C1). Mudancas do C2 em fases/faseC.md
hostname OBS-AS65100
!
interface eth0
 description RNP
 ip address 10.3.0.2/30
!
interface eth1
 description ATK-DIRETO
 ip address 10.4.0.2/30
!
interface eth2
 description DEST
 ip address 10.5.0.1/30
!
! Ligacao direta com o switch do validador, ativa em todas as fases.
! O endereco usado no laboratorio nao foi registrado; 10.1.0.4 e sugerido
! para reproducao (validador .1, IFRN .2, RNP .3).
interface eth3
 description SWITCH-VALIDADOR
 ip address 10.1.0.4/24
!
ip route 10.0.0.0/30 10.3.0.1
ip route 10.2.0.0/30 10.3.0.1
!
rpki
 rpki cache tcp 10.1.0.1 3323 preference 1
exit
!
route-map ROV-IN deny 10
 match rpki invalid
route-map ROV-IN permit 20
!
router bgp 65100
 no bgp ebgp-requires-policy
 neighbor 10.3.0.1 remote-as 1916
 neighbor 10.3.0.1 description RNP-UPSTREAM
 neighbor 10.4.0.1 remote-as 65666
 neighbor 10.4.0.1 description ATACANTE-DIRETO
 neighbor 10.5.0.2 remote-as 65200
 neighbor 10.5.0.2 description DEST
 !
 address-family ipv4 unicast
  neighbor 10.3.0.1 soft-reconfiguration inbound
  neighbor 10.4.0.1 soft-reconfiguration inbound
  neighbor 10.5.0.2 soft-reconfiguration inbound
 exit-address-family
!
